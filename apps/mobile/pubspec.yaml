name: mobile
version: 0.0.1+1
publish_to: none

environment:
  sdk: ^3.10.0-290.4.beta
dependencies:
  # Flutter SDK
  flutter:
    sdk: flutter
  
  # Local packages
  core:
    path: packages/core
  # UI & Icons
  cupertino_icons: ^1.0.8
  responsive_framework: ^1.5.1
  flutter_screenutil: ^5.9.3
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  lottie: ^3.3.2
  loader_overlay: ^5.0.0
  fluttertoast: ^9.0.0
  
  # Networking
  dio: ^5.9.0
  
  # Localization
  easy_localization: ^3.0.8
  timezone: ^0.10.1
  
  # Local Storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  
  # Firebase
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  firebase_crashlytics: ^5.0.5
  firebase_analytics: ^12.0.4
  flutter_local_notifications: ^19.5.0
  
  # Forms & Validation
  form_builder_validators: ^11.2.0
  flutter_form_builder: ^10.2.0
  pinput: ^5.0.2
  
  # Authentication & Security
  jwt_decoder: ^2.0.1
  
  # Utils
  url_launcher: ^6.3.2
  equatable: ^2.0.7
  
  # Dependency Injection
  get_it: ^9.0.5
  injectable: ^2.6.0
  
  # Navigation
  auto_route: ^10.2.2
  
  # State Management
  flutter_bloc: ^9.1.1
  
  #Error observer
  sentry_flutter: ^9.8.0


  in_app_update: ^4.2.5
  upgrader: ^12.3.0
  
dev_dependencies:
  # Testing
  flutter_test:
    sdk: flutter
  
  # Code Generation
  build_runner: ^2.10.3
  flutter_gen_runner: ^5.12.0
  injectable_generator: ^2.9.1
  freezed: ^3.2.3
  freezed_annotation: ^3.1.0
  auto_route_generator: ^10.2.6
  
  # Code Quality & Formatting
  import_sorter: ^4.6.0
  flutter_lints: ^6.0.0
  
  # Development Tools
  change_app_package_name: ^1.5.0
flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/fonts/
    - assets/lottie/
    - assets/icons/

  fonts:
    - family: Almarai
      fonts:

        - asset: assets/fonts/Almarai-Light.ttf
          weight: 300
        - asset: assets/fonts/Almarai-Regular.ttf
          weight: 400
        - asset: assets/fonts/Almarai-Bold.ttf
          weight: 600
        - asset: assets/fonts/Almarai-ExtraBold.ttf  
          weight: 800          
  
  

  
  
  
  
  
  
  
  
  
  
  
  
  
